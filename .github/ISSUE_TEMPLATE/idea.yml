name: Idea or request
description: Something you'd like the add-on to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or annoyance, in your own words. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it working
  - type: input
    id: version
    attributes:
      label: Add-on version you're on
      placeholder: "1.27.0"
